name: Complete SiteHub SearchOps p38 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sitehub-p38-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete SearchOps contract in exact Pages artifact root
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('apps/homepage/static')
          p=root/'index.html'; h=p.read_text(encoding='utf-8')
          marker='SITEHUB-SEARCHOPS-P38'
          if marker not in h:
              schema='''\n<!-- SITEHUB-SEARCHOPS-P38 -->\n<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","name":"SuaveForge","url":"https://suaveforge.com/"},{"@type":"WebApplication","name":"Hashdate","url":"https://date.suaveforge.com/","description":"검증된 사람들과 더 진지하게 만나는 프리미엄 데이팅 앱 Hashdate","publisher":{"@type":"Organization","name":"SuaveForge","url":"https://suaveforge.com/"}}]}</script>\n'''
              h=h.replace('</head>',schema+'</head>',1)
              p.write_text(h,encoding='utf-8')
          (root/'robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: https://date.suaveforge.com/sitemap.xml\n',encoding='utf-8')
          (root/'sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://date.suaveforge.com/</loc></url></urlset>\n',encoding='utf-8')
          PY
          grep -q 'SITEHUB-SEARCHOPS-P38' apps/homepage/static/index.html
          grep -q 'application/ld+json' apps/homepage/static/index.html
          grep -q 'Sitemap: https://date.suaveforge.com/sitemap.xml' apps/homepage/static/robots.txt
          grep -q '<loc>https://date.suaveforge.com/</loc>' apps/homepage/static/sitemap.xml
          git config user.name 'SuaveForge SiteHub'
          git config user.email '53187583+programmer119@users.noreply.github.com'
          git add apps/homepage/static/index.html apps/homepage/static/robots.txt apps/homepage/static/sitemap.xml
          git diff --cached --quiet || (git commit -m 'Complete SiteHub SearchOps p38' && git push)
